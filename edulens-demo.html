<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduLens · AI作文分镜助手（演示版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14161f;
    --ink-soft: #4a4d5a;
    --paper: #faf9f6;
    --paper-card: #ffffff;
    --line: #e7e5df;
    --accent-1: #90c98d;
    --accent-2: #e8b93a;
    --accent-3: #e2694f;
    --accent-4: #6fa8c9;
    --shadow: 0 1px 2px rgba(20,22,31,0.04), 0 8px 24px rgba(20,22,31,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .mark{
    width:44px; height:44px; border-radius:11px;
    background:var(--ink);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Noto Serif SC'; font-weight:900; font-size:20px;
    flex-shrink:0;
  }
  .brand-name{ font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .demo-badge{
    margin-left:auto; font-size:11.5px; font-weight:700; padding:6px 14px;
    background:#FEF3C7; color:#92400E; border-radius:100px; border:1px solid #FDE68A;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }

  .wrap{ max-width:880px; margin:0 auto; padding:56px 24px 90px;}
  .hero-eyebrow{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--ink-soft); letter-spacing:1.5px; text-transform:uppercase;
    justify-content:center; margin-bottom:18px;
  }
  .hero-eyebrow::before, .hero-eyebrow::after{
    content:""; width:28px; height:1px; background:var(--line);
  }
  h1.hero{
    font-family:'Noto Serif SC'; font-weight:900;
    font-size:clamp(28px, 4.2vw, 42px);
    text-align:center; line-height:1.35; margin:0 0 18px;
  }
  p.hero-sub{
    text-align:center; color:var(--ink-soft); font-size:15.5px; line-height:1.75;
    max-width:560px; margin:0 auto 32px;
  }
  .demo-note{
    max-width:560px; margin:0 auto 44px; padding:14px 18px;
    background:#FFFBEB; border:1px solid #FDE68A; border-radius:11px;
    font-size:13px; color:#92400E; line-height:1.7; text-align:center;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
  }
  .form-card{ padding:34px 34px 28px; }
  .form-title{ font-size:16px; font-weight:700; margin:0 0 20px; display:flex; align-items:center; gap:8px;}
  label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:500;}
  select{
    width:100%; padding:14px 16px; font-size:15px;
    border:1px solid var(--line); border-radius:11px;
    background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%234a4d5a" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>') no-repeat right 14px center;
    appearance:none; -webkit-appearance:none;
    color:var(--ink); font-family:inherit;
  }
  select:focus{ outline:none; border-color:var(--ink); }
  .field-group{ margin-top:0; }

  button.generate{
    width:100%; margin-top:26px; padding:16px;
    background:var(--ink); color:#fff; border:none; border-radius:12px;
    font-size:15.5px; font-weight:600; font-family:inherit;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .12s, background .15s;
  }
  button.generate:hover{ background:#000; }
  button.generate:active{ transform:scale(0.985); }

  .foot-note{
    border-top:1px solid var(--line); margin-top:24px; padding-top:16px;
    font-size:12px; color:#9a9a96; line-height:1.8;
  }

  .spin{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.35); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .result-shell{ margin-top:28px; padding:70px 34px; text-align:center;}
  .empty-icon{
    width:64px; height:64px; margin:0 auto 22px;
    border-radius:50%; background:#f1f0eb;
    display:flex; align-items:center; justify-content:center;
    color:#b5b3ac;
  }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:8px;}
  .empty-sub{ color:var(--ink-soft); font-size:13.5px; }

  .result{ margin-top:34px; }
  .result-meta{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:6px; flex-wrap:wrap;
  }
  .result-title{ font-family:'Noto Serif SC'; font-weight:900; font-size:24px; }
  .result-tags{ display:flex; gap:8px; }
  .tag{
    font-size:11.5px; padding:4px 10px; border-radius:100px;
    border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;
  }
  .theme-box{
    margin-top:16px; padding:18px 20px; border-radius:13px;
    background:#f6f5f0; font-size:14.5px; line-height:1.8; color:#33352f;
    border-left:3px solid var(--ink);
  }
  .theme-box b{ display:block; font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:5px; letter-spacing:0.5px;}

  .section-label{
    font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--ink-soft); margin:40px 0 16px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--line); }

  .curve{ display:flex; gap:0; position:relative; padding:6px 0 0;}
  .curve-node{ flex:1; position:relative; padding:0 10px; }
  .curve-node:not(:last-child)::after{
    content:""; position:absolute; top:9px; right:-6px; width:calc(100% - 6px); height:2px;
    background:linear-gradient(to right, var(--line), var(--line));
  }
  .dot{
    width:20px; height:20px; border-radius:50%; margin-bottom:14px;
    border:3px solid #fff; box-shadow:0 0 0 2px var(--line);
    position:relative; z-index:2;
  }
  .curve-point{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:3px;}
  .curve-emotion{ font-size:14.5px; font-weight:700; margin-bottom:6px; }
  .curve-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.65;}

  .shot{
    display:grid; grid-template-columns:64px 1fr; gap:22px;
    padding:26px 0; border-top:1px dashed var(--line);
  }
  .shot:first-of-type{ border-top:1px solid var(--line); }
  .shot-badge{
    width:56px; height:56px; border-radius:13px;
    background:var(--ink); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Noto Serif SC'; font-weight:700;
  }
  .shot-badge .num{ font-size:10px; opacity:0.6; }
  .shot-badge .type{ font-size:15px; margin-top:1px; }
  .shot-skill{ font-size:15.5px; font-weight:700; margin-bottom:10px;}
  .shot-example{
    font-size:14px; line-height:1.85; color:#2b2d24;
    background:#f6f5f0; padding:14px 16px; border-radius:11px; margin-bottom:14px;
    font-family:'Noto Serif SC'; font-weight:500;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
  .chip-label{ font-size:11.5px; color:#a5a39c; margin-right:6px; align-self:center;}
  .chip{
    font-size:12.5px; padding:5px 11px; border-radius:8px;
    background:#fff; border:1px solid var(--line); color:var(--ink-soft);
  }
  .chip.sense{ background:#fbf6ea; border-color:#f0e4c4; color:#8a6d1f;}
  .tip-line{
    font-size:12.5px; color:var(--ink-soft); margin-top:12px; padding-top:12px;
    border-top:1px solid var(--line); display:flex; gap:8px; line-height:1.7;
  }
  .tip-line b{ color:var(--ink); flex-shrink:0; }

  .mistakes{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
  .mistakes li{
    font-size:13.5px; line-height:1.75; color:#33352f;
    padding:13px 16px; border-radius:10px; background:#fdf3f1; border-left:3px solid var(--accent-3);
  }
  .upgrade{
    padding:18px 20px; border-radius:13px; background:#eef5f0; border-left:3px solid var(--accent-1);
    font-size:13.5px; line-height:1.8; color:#2b3f31; margin-top:14px;
  }
  .upgrade b{ display:block; font-size:12px; color:#4a7a55; margin-bottom:5px; font-weight:700; letter-spacing:0.5px;}

  footer{ text-align:center; color:#b5b3ac; font-size:12px; padding:36px 0 44px; }

  @media (max-width:640px){
    .form-card{ padding:26px 20px 22px; }
    .shot{ grid-template-columns:48px 1fr; gap:14px; }
    .shot-badge{ width:48px; height:48px; border-radius:11px; }
    .shot-badge .type{ font-size:13px; }
    .curve{ flex-direction:column; gap:18px; }
    .curve-node::after{ display:none; }
    .demo-badge{ margin-left:0; }
  }
</style>
</head>

  <div id="resultArea">

</div>

  "upgrade_tip": "基础较好的学生可以加入一个\"帮助者\"的细节——比如爸爸在后面扶着车、朋友的一句鼓励——通过这个人的一句话或一个动作，侧面烘托自己的心情变化"
},
{
  "meta": {"title": "让真情自然流露", "grade": "小学六年级", "word_count": "约500字"},
  "theme": "把内心真实的情感藏进具体的人、事、物之中，让读者自己从细节里读出感动，而不是靠直接喊出来",
  "emotion_curve": [
    {"point": "开头", "emotion": "平淡/习以为常", "description": "先写日常中不起眼的一幕，情感还没被察觉"},
    {"point": "发展", "emotion": "触动/若有所思", "description": "一个细节让人开始留意，情感悄悄浮现"},
    {"point": "高潮", "emotion": "情感涌上心头", "description": "某个瞬间情感集中释放，但仍克制、不喊口号"},
    {"point": "结尾", "emotion": "怅然/温暖的余韵", "description": "情感沉淀下来，借景物留下悠长的回味"}
  ],
  "shots": [
    {"shot_type": "全景", "writing_skill": "用一个日常场景做铺垫，情感先藏而不露", "example": "清晨的厨房里，锅铲碰着锅沿发出「叮叮」的声响，妈妈的背影在雾气中忽隐忽现，像每一个平常的早晨一样。", "sensory_words": ["雾气缭绕", "忽隐忽现", "叮叮当当", "微凉", "昏黄"], "sentence_starters": ["清晨的", "像往常一样，", "厨房里"], "teacher_tip": "提醒学生：先别急着抒情，越是普通的画面，后面的触动才越真实"},
    {"shot_type": "中景", "writing_skill": "写一个具体的小动作，让情感开始渗出来", "example": "她转过身，把最大的那个鸡蛋放进我碗里，又若无其事地拿走了盘子里那个煎得有些破的。", "sensory_words": ["若无其事", "悄悄地", "轻轻放下", "不经意间", "顺手"], "sentence_starters": ["她转过身，", "不知不觉，", "我注意到"], "teacher_tip": "让学生找一个\"不经意\"的小动作，越不刻意，情感越真实"},

  ],
  "upgrade_tip": "基础较好的学生可以尝试\"欲扬先抑\"——开头写一个自己曾经的误解或忽略（比如觉得妈妈唠叨），再通过细节推翻这个误解，让情感的转折更有力度"

const genBtn = document.getElementById('genBtn');
const btnLabel = document.getElementById('btnLabel');
const resultArea = document.getElementById('resultArea');
const demoSelect = document.getElementById('demoSelect');

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderResult(data){
  const colors = ['#90c98d','#e8b93a','#e2694f','#6fa8c9'];
  const curveHtml = (data.emotion_curve||[]).map((c,i)=>`
    <div class="curve-node">
      <div class="dot" style="background:${colors[i%4]}"></div>
      <div class="curve-point">${escapeHtml(c.point||'')}</div>
      <div class="curve-emotion" style="color:${colors[i%4]}">${escapeHtml(c.emotion||'')}</div>
      <div class="curve-desc">${escapeHtml(c.description||'')}</div>
    </div>
  `).join('');

  const shotsHtml = (data.shots||[]).map((s,i)=>`
    <div class="shot">
      <div class="shot-badge">
        <div class="num">0${i+1}</div>
        <div class="type">${escapeHtml(s.shot_type||'')}</div>
      </div>
      <div>
        <div class="shot-skill">${escapeHtml(s.writing_skill||'')}</div>
        <div class="shot-example">${escapeHtml(s.example||'')}</div>
        <div class="chip-row">
          <span class="chip-label">感官词</span>
          ${(s.sensory_words||[]).map(w=>`<span class="chip sense">${escapeHtml(w)}</span>`).join('')}
        </div>
        <div class="chip-row">
          <span class="chip-label">句子开头</span>
          ${(s.sentence_starters||[]).map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join('')}
        </div>
        <div class="tip-line"><b>教师提示</b><span>${escapeHtml(s.teacher_tip||'')}</span></div>
      </div>
    </div>
  `).join('');

  const mistakesHtml = (data.common_mistakes||[]).map(m=>`<li>${escapeHtml(m)}</li>`).join('');

  resultArea.innerHTML = `
    <div class="result">
      <div class="result-meta">
        <div class="result-title">${escapeHtml(data.meta.title)}</div>
        <div class="result-tags">
          <span class="tag">${escapeHtml(data.meta.grade)}</span>
          <span class="tag">${escapeHtml(data.meta.word_count)}</span>
        </div>
      </div>
      <div class="theme-box"><b>核心立意</b>${escapeHtml(data.theme||'')}</div>

      <div class="section-label">情绪曲线</div>
      <div class="curve">${curveHtml}</div>

      <div class="section-label">五镜头写作分解</div>
      ${shotsHtml}

      <div class="section-label">常见误区</div>
      <ul class="mistakes">${mistakesHtml}</ul>

      <div class="upgrade"><b>进阶建议</b>${escapeHtml(data.upgrade_tip||'')}</div>
    </div>
  `;
}

function renderLoading(){
  resultArea.innerHTML = `
    <div class="card result-shell">
      <div class="empty-icon"><div class="spin" style="border-color:rgba(20,22,31,0.15); border-top-color:var(--ink);"></div></div>
      <div class="empty-title">正在生成分镜板…</div>
      <div class="empty-sub">演示版模拟生成过程</div>
    </div>
  `;
}

genBtn.addEventListener('click', () => {
  const idx = parseInt(demoSelect.value, 10);
  genBtn.disabled = true;
  btnLabel.textContent = '生成中…';
  renderLoading();

  setTimeout(() => {
    renderResult(DEMO_DATA[idx]);
    genBtn.disabled = false;
    btnLabel.textContent = '生成分镜板';
  }, 900);
});
</script>

</body>
</html>
